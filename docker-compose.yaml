version: '3.8'
services: 


  fix-permissions:
    image: alpine
    user: root
    volumes:
      - ./logs:/logs
    command: >
      sh -c "
        mkdir -p /logs/airflow /logs/flask &&
        chown -R 50000:0 /logs/airflow &&
        chown -R 0:0 /logs/flask &&
        chmod -R 775 /logs"

  postgres:
  
    image: timescale/timescaledb:latest-pg16
    container_name: iot-timescale-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - iot_network

  x-airflow-common: &airflow-common
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${AIRFLOW_DB}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: '${AIRFLOW_SECRET_KEY}'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IOT_DB: ${IOT_DB}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs/airflow:/opt/airflow/logs   
      - buffer_volume:/app/storage/buffer
    user: "50000:0"
    networks:
      - iot_network


  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    depends_on:
      fix-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: >
      bash -c "
      airflow db migrate && 
      airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password ${POSTGRES_PASSWORD}"


  flask-ingest:
    build: ./flask
    container_name: iot-flask
    shm_size: '256mb'
    ports:
      - "5001:5000"
    depends_on:
      fix-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      IOT_DB: ${IOT_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - buffer_volume:/app/storage/buffer
      - ./storage/quarantine:/app/storage/quarantine
      - ./logs/flask:/app/logs            
    networks:
      - iot_network

 
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    restart: always


  grafana:
    image: grafana/grafana-oss:latest
    container_name: iot-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dashboards:/etc/grafana/provisioning/dashboards
      - ./dashboards/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iot_network

  loki:
    image: grafana/loki:2.8.2
    container_name: iot-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - iot_network


  promtail:
    image: grafana/promtail:2.8.2
    container_name: iot-promtail
    volumes:
      - ./logs:/var/log/central_hub:ro     
      - ./promtail:/etc/promtail
    command: -config.file=/etc/promtail/config.yaml
    user: "root"
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - iot_network

networks:
  iot_network:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
  buffer_volume:
    driver: local